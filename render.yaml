services:
  - type: web
    name: smart-farming-assistant
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
